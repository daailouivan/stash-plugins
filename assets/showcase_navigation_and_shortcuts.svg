<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1117" />
      <stop offset="50%" stop-color="#141824" />
      <stop offset="100%" stop-color="#1a2030" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#88c0d0" />
      <stop offset="50%" stop-color="#81a1c1" />
      <stop offset="100%" stop-color="#5e81ac" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1100" height="540" rx="12" fill="url(#bgGrad)" stroke="#2e3440" stroke-width="2" />
  <rect x="0" y="0" width="1100" height="4" fill="url(#accentGrad)" />

  <!-- Header & Title -->
  <g transform="translate(40, 36)">
    <text x="0" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#eceff4">🧭 Two-Line Navigation Bar &amp; Power Controls</text>
    <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#81a1c1">Streamlined path line with icon-only controls, colored tree metrics, full-width search, and quick tools.</text>
  </g>

  <!-- Panel 1: Clean Header (Branding & Window Control) -->
  <g transform="translate(40, 96)" filter="url(#shadow)">
    <rect width="1020" height="44" rx="8" fill="#181c25" stroke="#2c3344" stroke-width="1.5" />
    
    <!-- Stash Brand -->
    <g transform="translate(18, 9)">
      <rect width="26" height="26" rx="6" fill="#88c0d0" fill-opacity="0.15" stroke="#88c0d0" stroke-width="1.2" />
      <path d="M6 9h4l2 2h7c.6 0 1 .4 1 1v6c0 .6-.4 1-1 1H6c-.6 0-1-.4-1-1v-8c0-.6.4-1 1-1z" fill="#88c0d0" />
      <text x="34" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#eceff4">Stash File Manager</text>
      <rect x="165" y="3" width="94" height="20" rx="10" fill="#242933" />
      <text x="212" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#81a1c1" text-anchor="middle">1,428 scenes</text>
    </g>

    <!-- Close Button -->
    <g transform="translate(930, 9)">
      <rect width="72" height="26" rx="6" fill="#242933" stroke="#3b4252" stroke-width="1" />
      <text x="36" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#d8dee9" text-anchor="middle">✕ Close</text>
    </g>
  </g>

  <!-- Panel 2: Two-Line Path Navigation & Controls Container -->
  <g transform="translate(40, 150)" filter="url(#shadow)">
    <rect width="1020" height="88" rx="8" fill="#181c25" stroke="#282e3d" stroke-width="1.5" />

    <!-- LINE 1: Path Navigation Row -->
    <g transform="translate(14, 12)">
      <!-- Back & Up (Icons Only, Grouped 2 as 1) -->
      <rect width="28" height="26" rx="4" fill="#242933" stroke="#3b4252" stroke-width="1" />
      <text x="14" y="17" font-family="sans-serif" font-size="12" fill="#d8dee9" text-anchor="middle">◀</text>
      <rect x="29" y="0" width="28" height="26" rx="4" fill="#242933" stroke="#3b4252" stroke-width="1" />
      <text x="43" y="17" font-family="sans-serif" font-size="12" fill="#d8dee9" text-anchor="middle">▲</text>

      <!-- Path Root (Stash with Home Icon) -->
      <g transform="translate(68, 0)">
        <rect width="70" height="26" rx="4" fill="#1c212c" />
        <path d="M9 13l4.5-3.5 4.5 3.5v5.5a1 1 0 0 1-1 1h-2v-4h-3v4h-2a1 1 0 0 1-1-1v-5.5z" fill="#88c0d0" />
        <text x="24" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#eceff4">Stash</text>
      </g>

      <!-- Breadcrumbs with Truncation -->
      <g transform="translate(145, 0)">
        <text x="0" y="17" font-family="sans-serif" font-size="12" fill="#4c566a">›</text>
        <text x="12" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#88c0d0">Studios</text>
        <text x="62" y="17" font-family="sans-serif" font-size="12" fill="#4c566a">›</text>
        <rect x="72" y="1" width="82" height="24" rx="4" fill="#1c212c" />
        <text x="113" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#88c0d0" text-anchor="middle">2024 Series…</text>
        <text x="160" y="17" font-family="sans-serif" font-size="12" fill="#4c566a">›</text>
        <text x="174" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#eceff4">Episode 01</text>
      </g>

      <!-- Counts & Size with Colored Digits -->
      <g transform="translate(405, 2)">
        <rect width="186" height="22" rx="11" fill="#242933" stroke="#3b4252" stroke-width="1" />
        <text x="12" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#88c0d0">8</text>
        <text x="22" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#d8dee9"> direct · </text>
        <text x="66" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#81a1c1">36</text>
        <text x="82" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#d8dee9"> in tree (</text>
        <text x="125" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#a3be8c">18.4 GB</text>
        <text x="168" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#d8dee9">)</text>
      </g>

      <!-- Scan & Grid (Icons Only, Grouped 2 as 1) -->
      <g transform="translate(605, 0)">
        <rect width="28" height="26" rx="4" fill="#242933" stroke="#3b4252" stroke-width="1" />
        <text x="14" y="17" font-family="sans-serif" font-size="11" fill="#88c0d0" text-anchor="middle">◎</text>
        <rect x="29" y="0" width="28" height="26" rx="4" fill="#242933" stroke="#3b4252" stroke-width="1" />
        <text x="43" y="17" font-family="sans-serif" font-size="11" fill="#88c0d0" text-anchor="middle">⊞</text>
      </g>

      <!-- Settings (Anchored to Right) -->
      <g transform="translate(896, 0)">
        <rect width="96" height="26" rx="4" fill="#242933" stroke="#3b4252" stroke-width="1" />
        <text x="48" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#d8dee9" text-anchor="middle">⚙ Settings</text>
      </g>
    </g>

    <!-- LINE 2: Controls & Search Row -->
    <g transform="translate(14, 48)">
      <!-- Left: Folder Sort / Scene Sort -->
      <g transform="translate(0, 3)">
        <rect width="112" height="26" rx="4" fill="#141720" stroke="#3b4252" stroke-width="1" />
        <text x="8" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#81a1c1">Folders:</text>
        <text x="52" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#d8dee9">Name (A-Z) ▼</text>

        <rect x="118" y="0" width="112" height="26" rx="4" fill="#141720" stroke="#3b4252" stroke-width="1" />
        <text x="126" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#81a1c1">Scenes:</text>
        <text x="168" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#d8dee9">Title (A-Z) ▼</text>
      </g>

      <!-- Center: Full-Width Stretching Search Box -->
      <g transform="translate(244, 1)">
        <rect width="570" height="30" rx="15" fill="#141720" stroke="#3b4252" stroke-width="1" />
        <circle cx="18" cy="15" r="5" fill="none" stroke="#81a1c1" stroke-width="1.5" />
        <line x1="22" y1="19" x2="26" y2="23" stroke="#81a1c1" stroke-width="1.5" stroke-linecap="round" />
        <text x="34" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#81a1c1">Search folder or scenes by title, studio, performer... </text>
        <rect x="350" y="6" width="94" height="18" rx="4" fill="#242a36" />
        <text x="397" y="19" font-family="monospace" font-size="9.5" fill="#d8dee9" text-anchor="middle">Press / to focus</text>
        <!-- Circular Clear Button -->
        <circle cx="552" cy="15" r="8.5" fill="#2e3544" />
        <text x="552" y="18.5" font-family="sans-serif" font-size="10" fill="#88c0d0" text-anchor="middle" font-weight="700">✕</text>
      </g>

      <!-- Right: Batch Edit & Parse (Anchored to Right) -->
      <g transform="translate(826, 3)">
        <rect width="84" height="26" rx="4" fill="#242933" stroke="#88c0d0" stroke-width="1" />
        <text x="42" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#88c0d0" text-anchor="middle">✎ Batch Edit</text>
        <rect x="86" y="0" width="76" height="26" rx="4" fill="#242933" stroke="#ebcb8b" stroke-width="1" />
        <text x="124" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#ebcb8b" text-anchor="middle">🔍 Parse</text>
      </g>
    </g>
  </g>

  <!-- Panel 3: Section Headers & Aligned Action Controls -->
  <g transform="translate(40, 248)" filter="url(#shadow)">
    <!-- Subfolders Header -->
    <rect width="1020" height="44" rx="8" fill="#141822" stroke="#282e3d" stroke-width="1.2" />
    <text x="18" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#eceff4">Subfolders</text>
    <rect x="98" y="12" width="28" height="20" rx="10" fill="#242933" />
    <text x="112" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#81a1c1" text-anchor="middle">6</text>

    <!-- Subfolder Aligned Pills -->
    <g transform="translate(138, 10)">
      <rect width="135" height="24" rx="4" fill="#88c0d0" />
      <text x="67" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#181c25" text-anchor="middle">Include Sub-folders</text>
      <rect x="142" y="0" width="112" height="24" rx="4" fill="#81a1c1" />
      <text x="198" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#181c25" text-anchor="middle">Folder Sort First</text>
      <rect x="261" y="0" width="84" height="24" rx="4" fill="#242933" stroke="#3b4252" stroke-width="1" />
      <text x="303" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#d8dee9" text-anchor="middle">Hide Empty</text>
    </g>

    <!-- Subfolders View Switcher -->
    <g transform="translate(860, 10)">
      <rect width="144" height="24" rx="4" fill="#1e2330" stroke="#3b4252" stroke-width="1" />
      <rect x="0" y="0" width="48" height="24" rx="4" fill="#88c0d0" />
      <text x="24" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#181c25" text-anchor="middle">Cards</text>
      <text x="72" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#81a1c1" text-anchor="middle">List</text>
      <text x="120" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#81a1c1" text-anchor="middle">Details</text>
    </g>
  </g>

  <!-- Panel 4: Keyboard Shortcuts & Dynamic Bar Reference -->
  <g transform="translate(40, 302)">
    <!-- Floating Bulk Bar Mockup -->
    <g transform="translate(0, 10)" filter="url(#shadow)">
      <rect width="490" height="74" rx="12" fill="#181c25" stroke="#2e3440" stroke-width="1.5" />
      <text x="18" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#81a1c1">FLOATING BULK ACTION BAR</text>
      
      <!-- Inner Floating Bar -->
      <g transform="translate(18, 32)">
        <rect width="454" height="34" rx="17" fill="#1e232d" stroke="#3b4252" stroke-width="1" />
        <rect x="8" y="5" width="88" height="24" rx="12" fill="#5e81ac" />
        <text x="52" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#eceff4" text-anchor="middle">12 Selected</text>

        <g transform="translate(104, 5)">
          <rect width="84" height="24" rx="4" fill="#88c0d0" />
          <text x="42" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#181c25" text-anchor="middle">✎ Batch Edit</text>
          <rect x="88" y="0" width="64" height="24" rx="4" fill="#242933" stroke="#ebcb8b" stroke-width="1" />
          <text x="120" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#ebcb8b" text-anchor="middle">🔍 Parse</text>
          <rect x="156" y="0" width="84" height="24" rx="4" fill="#242933" stroke="#88c0d0" stroke-width="1" />
          <text x="198" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#88c0d0" text-anchor="middle">⊞ Stash Grid</text>
          <rect x="244" y="0" width="54" height="24" rx="4" fill="#242933" stroke="#4c566a" stroke-width="1" />
          <text x="271" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#eceff4" text-anchor="middle">✕ Clear</text>
        </g>
      </g>
    </g>

    <!-- Keyboard Shortcuts Reference Card -->
    <g transform="translate(510, 10)" filter="url(#shadow)">
      <rect width="510" height="74" rx="12" fill="#181c25" stroke="#2e3440" stroke-width="1.5" />
      <text x="18" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#88c0d0">⚡ DIRECTORY KEYBOARD NAVIGATION SHORTCUTS</text>

      <g transform="translate(18, 36)">
        <rect x="0" y="0" width="26" height="22" rx="4" fill="#2e3440" stroke="#4c566a" stroke-width="1" />
        <text x="13" y="15" font-family="monospace" font-size="12" font-weight="700" fill="#88c0d0" text-anchor="middle">/</text>
        <text x="32" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#d8dee9">Search</text>

        <rect x="80" y="0" width="70" height="22" rx="4" fill="#2e3440" stroke="#4c566a" stroke-width="1" />
        <text x="115" y="15" font-family="monospace" font-size="9.5" font-weight="700" fill="#88c0d0" text-anchor="middle">Backspace</text>
        <text x="156" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#d8dee9">Up</text>

        <rect x="185" y="0" width="58" height="22" rx="4" fill="#2e3440" stroke="#4c566a" stroke-width="1" />
        <text x="214" y="15" font-family="monospace" font-size="9.5" font-weight="700" fill="#88c0d0" text-anchor="middle">Ctrl + A</text>
        <text x="248" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#d8dee9">Select All</text>

        <rect x="315" y="0" width="34" height="22" rx="4" fill="#2e3440" stroke="#4c566a" stroke-width="1" />
        <text x="332" y="15" font-family="monospace" font-size="9.5" font-weight="700" fill="#88c0d0" text-anchor="middle">Esc</text>
        <text x="355" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#d8dee9">Clear/Dismiss</text>

        <rect x="430" y="0" width="52" height="22" rx="4" fill="#2e3440" stroke="#4c566a" stroke-width="1" />
        <text x="456" y="15" font-family="monospace" font-size="9.5" font-weight="700" fill="#88c0d0" text-anchor="middle">Alt+←</text>
      </g>
    </g>
  </g>
</svg>
